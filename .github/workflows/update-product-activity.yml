name: Refresh public product activity

on:
  # Refresh immediately when the activity pipeline itself changes on develop.
  push:
    branches: [develop]
    paths:
      - '.github/workflows/update-product-activity.yml'
      - 'scripts/generate-product-activity.mjs'
      - 'scripts/generate-product-activity.test.mjs'
  schedule:
    # Weekly refreshes keep the public portfolio trend current without noisy daily commits.
    - cron: '17 11 * * 1'
  workflow_dispatch:

# Read PR metadata for release notes; write only the generated activity branch.
permissions:
  contents: write
  pull-requests: read

concurrency:
  group: public-product-activity
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate activity classification
        run: node --test scripts/generate-product-activity.test.mjs

      - name: Generate rolling six-month activity
        run: node scripts/generate-product-activity.mjs --output /tmp/product-activity.json --months 6 --branch develop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate generated commit totals
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync('/tmp/product-activity.json', 'utf8'));
          if (data.activityModel !== 'commit-centric-v1') throw new Error('Unexpected activity model');
          if (!Array.isArray(data.months) || data.months.length !== 6) throw new Error('Expected six monthly rows');
          for (const month of data.months) {
            const classified = month.productCommits + month.qualityCommits + month.deliveryCommits + month.otherCommits;
            if (classified !== month.developmentCommits) {
              throw new Error(`${month.label}: classified ${classified} commits but total is ${month.developmentCommits}`);
            }
          }
          NODE

      - name: Publish JSON to activity-data branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Prefer the stable update path once the generated branch exists.
          if git ls-remote --exit-code --heads origin activity-data >/dev/null 2>&1; then
            git fetch origin activity-data
            git switch --force-create activity-data origin/activity-data
          else
            # `git switch --orphan` clears tracked files. Clean any remaining
            # untracked or ignored files without failing on an empty worktree.
            git switch --orphan activity-data
            git clean -fdx
          fi

          cp /tmp/product-activity.json product-activity.json
          printf '%s\n' \
            '# Generated product activity' \
            '' \
            'This branch is managed by GitHub Actions.' \
            'It is a data-publishing branch, not an application deployment branch.' > README.md
          touch .nojekyll

          # Vercel's project root is `frontend`. Keep that directory present on
          # the generated branch and explicitly disable Git deployments for it,
          # preventing every metrics refresh from becoming a failed preview.
          git rm -r --ignore-unmatch frontend >/dev/null 2>&1 || true
          mkdir -p frontend
          cat > frontend/vercel.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "git": {
              "deploymentEnabled": {
                "activity-data": false
              }
            }
          }
          JSON

          git add product-activity.json README.md .nojekyll frontend/vercel.json
          if git diff --cached --quiet; then
            echo "No activity change to publish."
            exit 0
          fi

          git commit -m "chore(activity): refresh public product metrics [skip ci]"
          git push origin HEAD:activity-data
